server.port=63080

spring.datasource.url=jdbc:postgresql://localhost:63432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=validate

# Enable tryout be default
springdoc.swagger-ui.tryItOutEnabled=true

# Generate OpenAPI description on each startup
# see: OpenApiDocGenerator.java
generate-open-api-doc-on-startup.enabled=true

# Sortieren der Properties von Components in der yaml-datei
# um die Ausgabe stabil zu halten
springdoc.writer-with-order-by-keys=true

recipify.web.images-dir=file://${user.dir}/web-root/images/
recipify.web.upload-dir=file://${user.dir}/web-root/images/upload/
recipify.web.upload-url-path=/images/upload/
recipify.web.spa-dir=file://${user.dir}/spa/out/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

generate-open-api-doc-on-startup.source:http://localhost:${server.port}/v3/api-docs.yaml