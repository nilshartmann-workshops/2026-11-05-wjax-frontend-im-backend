openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
  - description: Generated server url
    url: 'http://localhost:8080'
paths:
  /api/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
        - Login
  /api/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
        - Login
  /api/newsletter/subscribe:
    post:
      operationId: subscribeToNewsletter
      parameters:
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostNewsletterRegistrationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostNewsletterRegistrationResponse'
      tags:
        - newsletter-api-controller
  /api/recipes:
    get:
      operationId: recipes
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - time
              - likes
              - rating
              - createdAt
        - name: ids
          in: query
          required: false
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseRecipeDto'
      tags:
        - recipe-api-controller
  '/api/recipes/{recipeId}':
    get:
      operationId: getRecipe
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
      tags:
        - recipe-api-controller
  '/api/recipes/{recipeId}/explore':
    get:
      operationId: getExploreRecipes
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExploreRecipeDto'
      tags:
        - recipe-api-controller
  '/api/recipes/{recipeId}/feedback':
    get:
      operationId: getFeedback
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseFeedbackDto'
      tags:
        - recipe-api-controller
  '/api/recipes/{recipeId}/feedbacks':
    get:
      operationId: getFeedbacks
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeFeedbacksResponse'
      tags:
        - recipe-api-controller
    post:
      operationId: addFeedback
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostFeedbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostFeedbackResponse'
      tags:
        - recipe-api-controller
  '/api/recipes/{recipeId}/ingredients':
    get:
      operationId: getIngredients
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeIngredientsResponse'
      tags:
        - recipe-api-controller
  '/api/recipes/{recipeId}/likes':
    patch:
      operationId: incrementLikes
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncrementLikesResponse'
      tags:
        - recipe-api-controller
  /api/search:
    get:
      operationId: search
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseRecipeSummaryDto'
      tags:
        - recipe-api-controller
  '/api/search/{recipeId}/details':
    get:
      operationId: getSearchDetails
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
        - name: slowdown
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSearchDetailResponse'
      tags:
        - recipe-api-controller
components:
  schemas:
    ApprovalStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    CategoryDto:
      type: object
      properties:
        description:
          type: string
        icon:
          type: string
        id:
          type: string
        title:
          type: string
        type:
          type: string
      required:
        - description
        - icon
        - id
        - title
        - type
    DetailedRecipeDto:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
        cookTime:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        headline:
          type: string
        id:
          type: string
        image:
          $ref: '#/components/schemas/ImageDto'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/Instruction'
        likes:
          type: integer
          format: int32
        mealType:
          type: string
        preparationTime:
          type: integer
          format: int32
        title:
          type: string
        userFullname:
          type: string
      required:
        - categories
        - cookTime
        - createdAt
        - generatedAt
        - headline
        - id
        - image
        - ingredients
        - instructions
        - likes
        - mealType
        - preparationTime
        - title
        - userFullname
    ExploreRecipeDto:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        id:
          type: string
        image:
          $ref: '#/components/schemas/ImageDto'
        mealType:
          type: string
        title:
          type: string
      required:
        - generatedAt
        - id
        - image
        - mealType
        - title
    Feedback:
      type: object
      properties:
        approvalStatus:
          $ref: '#/components/schemas/ApprovalStatus'
        comment:
          type: string
        commenter:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        rating:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
      required:
        - comment
        - commenter
        - createdAt
        - rating
        - updatedAt
    FeedbackDto:
      type: object
      properties:
        comment:
          type: string
        commenter:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        rating:
          type: integer
          format: int32
      required:
        - comment
        - commenter
        - createdAt
        - id
        - rating
    GetRecipeFeedbacksResponse:
      type: object
      properties:
        feedbacks:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
      required:
        - feedbacks
    GetRecipeIngredientsResponse:
      type: object
      properties:
        id:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
      required:
        - id
        - ingredients
    GetRecipeResponse:
      type: object
      properties:
        recipe:
          $ref: '#/components/schemas/DetailedRecipeDto'
      required:
        - recipe
    GetSearchDetailResponse:
      type: object
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeDto'
      required:
        - recipe
    ImageDto:
      type: object
      properties:
        id:
          type: string
        src:
          type: string
        title:
          type: string
      required:
        - id
        - src
        - title
    IncrementLikesResponse:
      type: object
      properties:
        newLikes:
          type: integer
          format: int32
        recipeId:
          type: string
      required:
        - newLikes
        - recipeId
    Ingredient:
      type: object
      properties:
        amount:
          type: number
          format: double
        name:
          type: string
        orderNo:
          type: integer
          format: int32
        unit:
          type: string
      required:
        - amount
        - name
        - orderNo
        - unit
    Instruction:
      type: object
      properties:
        description:
          type: string
        orderNo:
          type: integer
          format: int32
    LoginRequest:
      type: object
      properties:
        password:
          type: string
        username:
          type: string
      required:
        - password
        - username
    LoginResponse:
      type: object
      properties:
        message:
          type: string
    NewFeedback:
      type: object
      properties:
        comment:
          type: string
        commenter:
          type: string
          maxLength: 2147483647
          minLength: 3
        stars:
          type: integer
          format: int32
          maximum: 5
          minimum: 0
      required:
        - comment
        - commenter
        - stars
    PageResponseFeedbackDto:
      type: object
      properties:
        content:
          items:
            $ref: '#/components/schemas/FeedbackDto'
          type: array
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
        meta:
          type: string
        pageNumber:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
      required:
        - content
        - hasNext
        - hasPrevious
        - pageNumber
        - totalPages
    PageResponseRecipeDto:
      type: object
      properties:
        content:
          items:
            $ref: '#/components/schemas/RecipeDto'
          type: array
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
        meta:
          type: string
        pageNumber:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
      required:
        - content
        - hasNext
        - hasPrevious
        - pageNumber
        - totalPages
    PageResponseRecipeSummaryDto:
      type: object
      properties:
        content:
          items:
            $ref: '#/components/schemas/RecipeSummaryDto'
          type: array
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
        meta:
          type: string
        pageNumber:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
      required:
        - content
        - hasNext
        - hasPrevious
        - pageNumber
        - totalPages
    PostFeedbackRequest:
      type: object
      properties:
        feedbackData:
          $ref: '#/components/schemas/NewFeedback'
      required:
        - feedbackData
    PostFeedbackResponse:
      type: object
      properties:
        newFeedback:
          $ref: '#/components/schemas/Feedback'
      required:
        - newFeedback
    PostNewsletterRegistrationRequest:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    PostNewsletterRegistrationResponse:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    RecipeDto:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
        cookTime:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        headline:
          type: string
        id:
          type: string
        image:
          $ref: '#/components/schemas/ImageDto'
        likes:
          type: integer
          format: int32
        mealType:
          type: string
        preparationTime:
          type: integer
          format: int32
        title:
          type: string
        userFullname:
          type: string
      required:
        - categories
        - cookTime
        - createdAt
        - generatedAt
        - headline
        - id
        - image
        - likes
        - mealType
        - preparationTime
        - title
        - userFullname
    RecipeSummaryDto:
      type: object
      properties:
        id:
          type: string
        mealType:
          type: string
        title:
          type: string
      required:
        - id
        - mealType
        - title
tags:
  - description: Login/Logout Endpoints
    name: Login
